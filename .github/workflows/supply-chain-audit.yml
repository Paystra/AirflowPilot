name: Supply chain audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Paystra/supply-chain-linter@d1a763bac178724488e37eb1838f0ad870a0dd67
        with:
          command: lint
          auto-commit: 'false'
          report-only: 'true'
